<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10002B"/><stop offset="1" stop-color="#240046"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#9D4EDD"/><stop offset="1" stop-color="#7B2FF7"/></linearGradient><radialGradient id="r" cx="0.85" cy="0.1" r="0.7"><stop offset="0" stop-color="#7B2FF7" stop-opacity=".35"/><stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/></radialGradient></defs><rect width="900" height="300" rx="14" fill="url(#g)"/><rect width="900" height="300" rx="14" fill="url(#r)"/><rect x=".5" y=".5" width="899" height="299" rx="14" fill="none" stroke="#9D4EDD" stroke-opacity=".25"/>
<text x="48" y="52" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#9D4EDD">~/shopify-dev  $  build --storefronts --fast</text>
<text x="48" y="150" font-family="Georgia,'Times New Roman',serif" font-size="68" font-weight="700" fill="#EDE7F6">Arjun</text>
<text x="48" y="218" font-family="Georgia,'Times New Roman',serif" font-size="68" font-style="italic" fill="#E0AAFF">Rajbhar.</text>
<text x="48" y="256" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9C89B8">Shopify Developer  ·  Liquid  ·  Frontend  ·  E-commerce</text>
<text x="48" y="276" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="13" fill="#9C89B8">Building stores that feel as good as they convert.</text>
<g transform="translate(600,60)" opacity=".95">
<rect width="250" height="180" rx="12" fill="#10002B" stroke="#9D4EDD" stroke-opacity=".4"/>
<circle cx="16" cy="16" r="4" fill="#ff5f57"/><circle cx="30" cy="16" r="4" fill="#febc2e"/><circle cx="44" cy="16" r="4" fill="#28c840"/>
<text x="16" y="52" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#E0AAFF">{% for product in collection.products %}</text>
