<text x="16" y="100" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#E0AAFF">{% endfor %}</text>
<text x="16" y="136" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#9C89B8">// responsive, accessible,</text>
<text x="16" y="154" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#9C89B8">// maintainable.</text>
